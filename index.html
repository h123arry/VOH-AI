<!DOCTYPE html>
<html>
<head>
  <title>VOH AI</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      text-align: center;
      background: #151515;
      padding: 15px;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .msg {
      padding: 12px;
      margin: 10px 0;
      border-radius: 12px;
      max-width: 80%;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .ai {
      background: #222;
    }

    #bottom {
      display: flex;
      padding: 10px;
      background: #151515;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
    }
  </style>
</head>

<body>

<h1>VOH AI 🚀</h1>

<div id="chat"></div>

<div id="bottom">
  <input id="message" placeholder="Ask VOH AI..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value;

  if (!text) return;

  const chat = document.getElementById("chat");

  chat.innerHTML += `
    <div class="msg user">${text}</div>
  `;

  input.value = "";

  const response = await fetch("/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: text
    })
  });

  const data = await response.json();

  chat.innerHTML += `
    <div class="msg ai">${data.reply}</div>
  `;

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
