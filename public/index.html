<!DOCTYPE html>
<html>
<head>
  <title>VOH AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>VOH AI 🚀</h1>

  <div id="chat-box"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
