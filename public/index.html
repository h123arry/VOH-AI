<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VOH AI</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <div class="top-bar">

      <div>
        <h1>VOH AI 🚀</h1>
        <p class="status">
          🟢 Online
        </p>
      </div>

      <button
        id="clear-btn"
        onclick="clearChat()"
      >
        Clear Chat
      </button>

    </div>

    <div id="chat-box"></div>

    <div id="typing" class="typing">
      VOH AI is typing
    </div>

    <div class="input-area">

      <button
        class="voice-btn"
        onclick="startVoice()"
      >
        🎤
      </button>

      <input
        type="text"
        id="message"
        placeholder="Ask VOH AI anything..."
        autocomplete="off"
      >

      <button
        id="send-btn"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
